<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CCC Sentiment System - Sign Up</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 340px; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .error { color: #dc3545; font-size: 0.9em; margin-bottom: 10px; }
        .link { text-align: center; margin-top: 15px; font-size: 0.9em; }
        .link a { color: #007bff; text-decoration: none; font-weight: bold; }

        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9); display: none;
            justify-content: center; align-items: center; z-index: 9999; flex-direction: column;
        }
        .spinner { border: 6px solid #f3f3f3; border-top: 6px solid #28a745; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <p style="margin-top: 15px;" id="loader-text">Creating Account...</p>
    </div>

    <div class="card">
        <h3 style="margin-top: 0;">Create New Account</h3>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('signup') }}" onsubmit="showLoader('Registering User...')">
            <label>Username</label>
            <input type="text" name="username" required autocomplete="off">
            <label>Password</label>
            <input type="password" name="password" required>
            <button type="submit">Sign Up</button>
        </form>

        <div class="link">
            Already registered? <a href="{{ url_for('login') }}">Back to Sign In</a>
        </div>
    </div>

    <script>
        function showLoader(text) {
            document.getElementById('loader-text').innerText = text;
            document.getElementById('loader').style.display = 'flex';
        }
    </script>
</body>
</html>
