<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CCC Sentiment System - Login</title>
    <style>
     body { font-family: Arial, sans-serif; background: #eef2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    .error { color: red; font-size: 0.9em; margin-bottom: 10px; }
        .link { text-align: center; margin-top: 15px; font-size: 0.9em; }
        .link a { color: #007bff; text-decoration: none; font-weight: bold; }

        /* Loading Screen Overlay */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9); display: none;
            justify-content: center; align-items: center; z-index: 9999; flex-direction: column;
        }
        .spinner { border: 6px solid #f3f3f3; border-top: 6px solid #007bff; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Loading screen thing-->
    <div id="loader">
        <div class="spinner"></div>
        <p style="margin-top: 15px;" id="loader-text">Logging in...</p>
    </div>

    <div class="card">
        <h3>CCC Evaluation Portal</h3>
         <!--  USE WHEN PYTHON BACK END WORKS!! {% if error %}<p class="error">{{ error }}</p>{% endif %}  -->
        <form method="POST" action="dashboard.html" onsubmit="showLoader('Authenticating...')">
            <label>Username</label>
            <input type="text" name="username" required>
            <label>Password</label>
            <input type="password" name="password" required>
            <a href="dashboard.html" onclick="showLoader('Redirecting to Dashboard...')"><button type="submit">Sign in</button></a>
        </form>
        <div class="link">
            Don't have an account? <a href="signup.html" onclick="showLoader('Redirecting to Sign Up...')">Sign Up</a>
        </div>
    </div>

    <script>
        function showLoader(text) {
            document.getElementById('loader-text').innerText = text;
            document.getElementById('loader').style.display = 'flex';
        }
    </script>
</body>
</html>
